[package]
name = "dayman"
version = "0.1.0"
description = "A local-first 24-hour Sun and Moon clock"
authors = ["Glen Gerbush"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/glengerbush/DayMan"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dayman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dayman"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
