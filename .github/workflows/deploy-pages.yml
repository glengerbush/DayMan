name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Select GitHub Pages base path
        shell: bash
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_ANDROID_APK_URL: ${{ vars.DAYMAN_ANDROID_APK_URL }}
          VITE_MACOS_DOWNLOAD_URL: ${{ vars.DAYMAN_MACOS_DOWNLOAD_URL }}
          VITE_LINUX_APPIMAGE_URL: ${{ vars.DAYMAN_LINUX_APPIMAGE_URL }}
          VITE_LINUX_DEB_URL: ${{ vars.DAYMAN_LINUX_DEB_URL }}
          VITE_LINUX_RPM_URL: ${{ vars.DAYMAN_LINUX_RPM_URL }}
          VITE_LINUX_ARCH_URL: ${{ vars.DAYMAN_LINUX_ARCH_URL }}

      - name: Verify generated PWA
        run: npm run verify:pwa

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
